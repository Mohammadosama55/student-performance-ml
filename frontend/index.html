<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Student Performance Predictor</h1>

        <form id="predictionForm">

            <label>Study Hours</label>
            <input type="number" id="study_hours" required>

            <label>Attendance (%)</label>
            <input type="number" id="attendance" required>

            <label>Previous Marks</label>
            <input type="number" id="previous_marks" required>

            <label>Assignments Completed</label>
            <input type="number" id="assignments_completed" required>

            <button type="submit">Predict Score</button>

        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
